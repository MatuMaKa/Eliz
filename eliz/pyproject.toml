[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eliz-lang"
version = "0.1.0a1"
description = "A programming language combining Java and Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MatuMaKa" }
]
keywords = ["eliz", "programming-language", "interpreter"]

[project.scripts]
eliz = "eliz.cli.commands:main"

[tool.setuptools.packages.find]
include = ["eliz*"]